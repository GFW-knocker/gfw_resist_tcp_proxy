# gfk client config (runs on your PC, needs admin + Npcap on Windows / root on Linux).
mode: client
transport: kcp            # must match the server

carrier:
  vps_ip: "203.0.113.10"  # the SERVER's public (filtered) IP
  server_port: 45000      # must match the server (base of the server-port span)
  server_port_span: 8     # server accepts N ports; client rotates dest across them on reconnect to escape a blocked port. MUST match server
  client_port: 40000      # carrier TCP source port on this machine (base of the rotation range)
  client_port_span: 8     # rotate source port across N ports on reconnect (avoids session collision); 1 = off
  interface: ""           # auto-detect; set the NIC name if detection is wrong
  mtu: 1400               # must match the server

firewall:
  manage: ask             # ask | yes | no

auth:
  key: "CHANGE-ME-long-random-shared-secret"  # must match the server

kcp:
  nodelay: 1              # 1 = low-latency mode (fast flush + ACK); 0 = normal (lower CPU, more delay)
  interval: 10            # internal update/flush period, ms (10 = responsive, 20-40 = lower CPU)
  resend: 2               # fast-retransmit after this many duplicate ACKs; 0 = disabled
  nc: 1                   # 1 = no congestion control (KCP's normal mode); 0 = CC on (usually WORSE here)
  sndwnd: 128             # send window, packets — the MAIN speed/latency knob
  rcvwnd: 128             # receive window, packets. Set near BDP: pkts ≈ bandwidth_bps × RTT_s / 8 / mtu.
                          # too small = caps speed; too large = bufferbloat (high jitter). See profiles.
  fec_data: 0             # Reed-Solomon FEC data shards; 0 = FEC off (saves bandwidth)
  fec_parity: 0           # parity shards (losses recovered per group); MUST match on both ends
  stream_buffer: 0        # smux per-connection buffer, bytes. 0 = auto (from window); override only if needed
  session_buffer: 0       # smux whole-tunnel buffer, bytes. 0 = auto
  # ── profiles: set the SAME nc + window on client AND server ──
  # dial-up ≤256 kbps    : sndwnd/rcvwnd:16
  # slow 1-6 Mbps        : sndwnd/rcvwnd:128   (default)
  # broadband 10-50 Mbps : sndwnd/rcvwnd:512
  # fast 100-500 Mbps    : sndwnd/rcvwnd:8192
  # lossy / adversarial  : add fec_data:10  fec_parity:3 (both ends)

client:
  # SOCKS5 proxy for any app (requires server allow_socks5: true). Empty disables.
  socks5_listen: "127.0.0.1:1080"
  # Fixed port-forwards: local listener -> server backend_ip:target_port.
  forwards:
    - {proto: tcp, listen: "127.0.0.1:14000", target_port: 443}
    - {proto: tcp, listen: "127.0.0.1:15000", target_port: 2096}
    - {proto: udp, listen: "127.0.0.1:17000", target_port: 945}
  keepalive_seconds: 4    # heartbeat; keeps the NAT pinhole open. Dead-peer detect ~= 2x this
  reconnect_seconds: 2    # delay between reconnect attempts

log_level: info
